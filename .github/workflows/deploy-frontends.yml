# Force rebuild
name: Deploy Frontend Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-rh/**'
      - 'frontend-projects/**'
      - '.github/workflows/deploy-frontends.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend-rh dependencies
        working-directory: frontend-rh
        run: npm ci

      - name: Build frontend-rh
        working-directory: frontend-rh
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          TS_NODE_TRANSPILE_ONLY: 'true'

      - name: Install frontend-projects dependencies
        working-directory: frontend-projects
        run: npm ci

      - name: Build frontend-projects
        working-directory: frontend-projects
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Create site structure
        run: |
          mkdir -p site/rh
          mkdir -p site/projects
          cp -r frontend-rh/dist/* site/rh/
          cp -r frontend-projects/dist/* site/projects/

      - name: Create index.html
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <title>Antigone</title>
              <script>window.location.replace('/Antigone_RH/rh/login');</script>
          </head>
          <body></body>
          </html>
          EOF
          cp site/index.html site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
