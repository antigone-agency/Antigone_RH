name: Deploy Frontend Projects to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-projects/**'
      - '.github/workflows/deploy-frontend-projects.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-frontend-projects
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-projects/package-lock.json'

      - name: Install dependencies
        working-directory: frontend-projects
        run: npm ci

      - name: Build
        working-directory: frontend-projects
        run: npm run build
        env:
          VITE_API_URL: https://${{ github.repository_owner }}.github.io/projects-api
          VITE_APP_TITLE: Antigone Projects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend-projects/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
