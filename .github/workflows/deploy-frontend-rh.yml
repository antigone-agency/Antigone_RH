name: Deploy Frontend RH to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend-rh/**'
      - '.github/workflows/deploy-frontend-rh.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-frontend-rh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-rh/package-lock.json'

      - name: Install dependencies
        working-directory: frontend-rh
        run: npm ci

      - name: Build
        working-directory: frontend-rh
        run: npm run build
        env:
          VITE_API_URL: https://${{ github.repository_owner }}.github.io/rh-api
          VITE_APP_TITLE: Antigone RH

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend-rh/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
